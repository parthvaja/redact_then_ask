[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "redact-then-ask"
version = "0.1.0"
description = "Privacy-first document pipeline: detect and pseudonymize PII, then chat with redacted text via a local LLM"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["nlp", "pii", "privacy", "redaction", "rag"]
dependencies = [
    # Core
    "pyyaml~=6.0",
    "typer~=0.12",
    "rich~=13.9",
    # Ingest
    "pymupdf~=1.24",
    "python-docx~=1.1",
    "charset-normalizer~=3.4",
    # Language ID
    "lingua-language-detector~=2.1",
    # Classification
    "scikit-learn~=1.5",
    "joblib~=1.4",
    # NER (CPU inference only in core; GPU extras in [train])
    "spacy~=3.8",
    "transformers~=4.44",
    # Regex validation
    "phonenumbers~=8.13",
    "python-stdnum~=1.20",
    "email-validator~=2.2",
    "dateparser~=1.2",
    # Redaction / mention clustering
    "faker~=30.0",
    "rapidfuzz~=3.10",
    # RAG
    "sentence-transformers~=3.2",
    "chromadb~=0.5",
    "pysbd~=0.3",
    "rank-bm25~=0.2",
    "httpx~=0.27",
    # Eval / visualisation
    "numpy~=2.1",
    "pandas~=2.2",
    "matplotlib~=3.9",
]

[project.optional-dependencies]
train = [
    # GPU fine-tuning; install separately on a machine with CUDA
    "torch~=2.4",
    "accelerate~=0.34",
    "datasets~=3.1",
    "seqeval~=1.2",
]
app = [
    "streamlit~=1.40",
]
baseline = [
    # Microsoft Presidio comparison system
    "presidio-analyzer~=2.2",
    "presidio-anonymizer~=2.2",
]
dev = [
    "pytest~=8.3",
    "pytest-cov~=5.0",
    "ruff~=0.7",
    "pre-commit~=4.0",
]

[project.scripts]
rta = "rta.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rta"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# ruff  (linter + formatter, replaces flake8/black/isort)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",   # line length — handled by formatter
    "B008",   # function calls in default args (Typer pattern)
    "UP007",  # use X | Y for union types — not yet universal in runtime
    "TCH",    # type-checking import blocks — many types are used at runtime
]

[tool.ruff.lint.isort]
known-first-party = ["rta"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
