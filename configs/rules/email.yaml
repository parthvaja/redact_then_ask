# ============================================================
# Email document rule pack
# ============================================================
# Applied when document type == "email".
# Supplements common.yaml with email header fields (From, To,
# CC, BCC, Reply-To) that reveal identities even before the body.

id: email

patterns:
  - id: header_from
    label: EMAIL
    regex: '(?i)^From:\s+.*?([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})'
    group: 1
    score: 0.98
    validator: email_validator

  - id: header_to
    label: EMAIL
    regex: '(?i)^To:\s+.*?([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})'
    group: 1
    score: 0.98
    validator: email_validator

  - id: header_cc
    label: EMAIL
    regex: '(?i)^(?:CC|BCC):\s+.*?([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})'
    group: 1
    score: 0.98
    validator: email_validator

  - id: header_name_from
    label: PERSON
    regex: '(?i)^From:\s+"?([A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,2})"?\s+<'
    group: 1
    score: 0.80

  - id: sent_date
    label: DATE
    regex: '(?i)^(?:Date|Sent)[:\s]+(.{10,40}(?:19|20)\d{2})'
    group: 1
    score: 0.85
    validator: date_validator

  - id: reply_to
    label: EMAIL
    regex: '(?i)^Reply-To:\s+.*?([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})'
    group: 1
    score: 0.98
    validator: email_validator

title_cues: ["Sent:", "From:", "To:", "Subject:", "Regards,", "Sincerely,"]
